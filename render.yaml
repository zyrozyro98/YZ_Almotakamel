services:
  # ---------------------------------------------------------------------------
  # Backend Service (Node.js Express App)
  # ---------------------------------------------------------------------------
  - type: web
    name: yz-almotakamel-backend
    env: node
    plan: starter # Starter plan recommended for persistent disk
    region: frankfurt
    buildCommand: npm install
    startCommand: node index.js
    rootDir: backend
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: WA_SESSION_PATH
        value: sessions
      # Note: Add FIREBASE_ADMIN_CREDENTIALS and other secrets in Render Dashboard
    # Persistent Disk for WhatsApp Sessions (Requires Paid Plan)
    disk:
      name: whatsapp-sessions
      mountPath: sessions
      sizeGB: 1

  # ---------------------------------------------------------------------------
  # Frontend Service (React + Nginx Docker)
  # ---------------------------------------------------------------------------
  - type: web
    name: yz-almotakamel-frontend
    env: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: Dockerfile.frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://yz-almotakamel-backend.onrender.com
      # Firebase keys will be inherited from the repo .env or can be set in dashboard

